name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ffmpeg is a runtime requirement for free-tier video watermarking (#401),
      # so its absence here left the compositing untested — every ffmpeg-gated
      # case skipped, and a broken filter argv would have passed CI green.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check (black)
        run: uv run black --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test with coverage (unit)
        run: uv run pytest --cov

      - name: Integration tests (MongoDB)
        # Runs against the mongo service above. ACE-Step integration tests skip
        # gracefully when their server is absent (see tests/conftest.py).
        run: uv run pytest -m integration
        env:
          ACEMUSIC_TEST_MONGODB_URL: mongodb://localhost:27017

  # US-26.0: web/ had no CI at all, which is why eleven npm advisories (eight high)
  # accumulated unnoticed. This is the security gate specifically; #426 added the `web`
  # job below for typecheck/lint/test/build.
  #
  # Kept separate from `web` on purpose. This job is lockfile-only and installs nothing,
  # so it still reports when `npm ci` is broken — folding it into `web` would let an
  # install failure mask the advisory result. Renaming it was also avoided: the job name
  # is its status-check name, and silently renaming a check that may be required on main
  # would leave that context permanently unreported.
  #
  # Its own job rather than a step in `ci`: it needs Node, not Python, and it must not
  # run once per Python version.
  web-audit:
    name: web npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm audit` reads the lockfile and does not need node_modules, so this skips
      # a full install. The advisory database is queried live, so a newly published
      # advisory can fail a PR that changed nothing — that is the point of a gate.
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

      # A lockfile can be internally inconsistent while `npm ci` still succeeds — an
      # npm version that drops bundled nested entries leaves declared dependencies
      # with no corresponding package entry. This PR shipped exactly that for one
      # commit, and only a reviewer caught it.
      - name: Check the web lockfile is internally consistent
        working-directory: web
        run: npm ls --package-lock-only --all > /dev/null

  # #426: nothing in CI executed a line of frontend code, so a change could break the whole
  # web suite and still show green. PR #417 did exactly that — it bumped `react` and left
  # `react-dom` behind, all 212 test files failed to load, and every check passed anyway.
  #
  # Measured against that regression, only one of these steps actually catches it:
  #
  #   npm audit / npm ls   pass    typecheck  pass    lint   pass    build  pass
  #   test                 FAIL  <- the only gate that sees it
  #
  # React's version check lives in react-dom's runtime client module. `next build` never
  # executes it; a jsdom test does, on import. So a build-only job would have shipped #417
  # too, and the `images` job running typecheck+build inside Docker is not a substitute.
  # Keep the test step even if this job is ever trimmed for time.
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pinned, not left to whatever setup-node bundles. Regenerating web/package-lock.json
      # with npm 11 drops the bundled nested @emnapi/* entries, which leaves declared
      # dependencies with no package entry and fails the lockfile check in `web-audit`
      # above. Contributors hit this depending on which npm they happen to have. If you
      # change this version, change the one documented in web/README.md too.
      - name: Pin npm
        run: npm install -g npm@10.9.8

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  # #429: the images are now the deploy artifact, so a Dockerfile that does not build is a
  # broken deploy. Without this the first place `docker build` runs is CD, on main, after
  # the merge that broke it. Build only — publishing is CD's job.
  #
  # The web build also runs `npm run typecheck` and `next build` inside the image. That
  # overlaps the `web` job above but is not redundant: this one proves the *image* builds,
  # which is what actually ships. It was never a substitute for #426 — see the table in
  # the `web` job for why typecheck+build alone miss the regression that motivated it.
  images:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
