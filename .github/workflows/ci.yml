name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ffmpeg is a runtime requirement for free-tier video watermarking (#401),
      # so its absence here left the compositing untested — every ffmpeg-gated
      # case skipped, and a broken filter argv would have passed CI green.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check (black)
        run: uv run black --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test with coverage (unit)
        run: uv run pytest --cov

      - name: Integration tests (MongoDB)
        # Runs against the mongo service above. ACE-Step integration tests skip
        # gracefully when their server is absent (see tests/conftest.py).
        run: uv run pytest -m integration
        env:
          ACEMUSIC_TEST_MONGODB_URL: mongodb://localhost:27017

  # US-26.0: web/ had no CI at all, which is why eleven npm advisories (eight high)
  # accumulated unnoticed. This is the security gate specifically — typecheck, lint,
  # test and build are still local-only, deliberately (they carry branch-protection
  # implications this change does not take on).
  #
  # Its own job rather than a step in `ci`: it needs Node, not Python, and it must not
  # run once per Python version.
  web-audit:
    name: web npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm audit` reads the lockfile and does not need node_modules, so this skips
      # a full install. The advisory database is queried live, so a newly published
      # advisory can fail a PR that changed nothing — that is the point of a gate.
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

      # A lockfile can be internally inconsistent while `npm ci` still succeeds — an
      # npm version that drops bundled nested entries leaves declared dependencies
      # with no corresponding package entry. This PR shipped exactly that for one
      # commit, and only a reviewer caught it.
      - name: Check the web lockfile is internally consistent
        working-directory: web
        run: npm ls --package-lock-only --all > /dev/null

  # #429: the images are now the deploy artifact, so a Dockerfile that does not build is a
  # broken deploy. Without this the first place `docker build` runs is CD, on main, after
  # the merge that broke it. Build only — publishing is CD's job.
  #
  # The web build also runs `npm run typecheck` and `next build` inside the image, which
  # is the first time either has run in automation. That is a side effect worth having,
  # not a substitute for #426.
  images:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
