name: GLM Review
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

jobs:
  review:
    # Only review substantial changes (5+ files, or 20+ additions, or 20+ deletions)
    # and never Dependabot PRs: their runs don't get MODEL_API_KEY
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
      github.event.pull_request.changed_files >= 5 ||
      github.event.pull_request.additions >= 20 ||
      github.event.pull_request.deletions >= 20)
    uses: frankbria/glm-review/.github/workflows/review.yml@502f7c15f0b5ccc89d50faa4026d57741750cb19 # 2026-11-03 # main @ 2026-10-24
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KIMI_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
